name: Pull request preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: worker-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify staging feature service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if ! pnpm exec wrangler deployments list \
            --name reference-example-kitchen-sink-statsig-staging \
            --json | jq -e 'length > 0' >/dev/null; then
            echo "::error::The staging feature service is not deployed. Run the 'Deploy Statsig staging' workflow before creating app Previews."
            exit 1
          fi
      - run: pnpm run check
      - run: pnpm run build
      - id: deploy
        name: Create or update Preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          deployment_url="$(printf '%s' "$json" | jq -r '.deployment.urls[0] // empty')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test Preview authentication
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          target="${DEPLOYMENT_URL:-$PREVIEW_URL}"
          pnpm run smoke:preview-auth -- "$target"
      - name: Comment Preview URLs
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-worker-preview -->';
            const deployment = process.env.DEPLOYMENT_URL
              ? `\n- Immutable deployment: ${process.env.DEPLOYMENT_URL}`
              : '';
            const body = `${marker}
            ### Cloudflare Worker Preview

            - Stable PR Preview: ${process.env.PREVIEW_URL}${deployment}

            New commits update the stable PR Preview URL. The immutable deployment URL, when present, remains pinned to this commit.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete Preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
