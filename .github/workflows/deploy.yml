name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js and restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run checks
        env:
          AUTH_SECRET: ci-test-only-auth-secret-at-least-32-bytes
          DEMO_USERNAME: demo
          DEMO_PASSWORD_HASH: pbkdf2_sha256$100000$salt$ac7d652639c389d536170d502b8e1ab2f5408a309d144e1aae216116d3594eb4
        run: pnpm run check
      - name: Deploy Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy
